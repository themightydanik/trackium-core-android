pluginManagement {
    repositories {
        google()
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
        }
        mavenCentral()
    }
}
rootProject.name = 'trackium-core-android'
include ':app', ':minimaapi', ':localization', ':maxima-core'
include ':core-regression'
include ':integrated-history', ':integrated-trackium'
project(':integrated-history').projectDir = file('integrated/history')
project(':integrated-trackium').projectDir = file('integrated/trackium')

include ":design-system"
