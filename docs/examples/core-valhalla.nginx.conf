# Standalone Nginx for an owner-controlled Valhalla attestor.
# Docker service valhalla shares a private network and has no published ports.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 9s;
    keepalive_timeout 0;
    client_max_body_size 8k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_conn_zone $server_name zone=connections:1m;
    limit_req_zone $server_name zone=rate:1m rate=4r/s;
    map "$request_method $request_uri" $allowed_route {
        default 0;
        "~^POST /route$" 1;
    }
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream core_router {
        zone core_router 64k;
        server valhalla:8002 resolve max_conns=2;
    }
    server {
        listen 8443 ssl default_server;
        server_name core-routing;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /pki/server.crt;
        ssl_certificate_key /pki/server.key;
        limit_conn connections 6;
        limit_req zone=rate burst=4 nodelay;
        location / {
            if ($allowed_route = 0) { return 404; }
            auth_basic "Core road routing";
            auth_basic_user_file /pki/users;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Host valhalla;
            proxy_connect_timeout 1s;
            proxy_send_timeout 8s;
            proxy_read_timeout 8s;
            proxy_next_upstream off;
            proxy_pass http://core_router;
        }
    }
}
